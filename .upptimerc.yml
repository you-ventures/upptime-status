owner: you-ventures
repo: upptime-status

sites:
  - name: AgentAIShield
    url: https://agentaishield.com
    expectedStatusCodes:
      - 200
      - 301
      - 302

  - name: AAIS App
    url: https://agentaishield.com/app.html
    expectedStatusCodes:
      - 200
      - 301
      - 302

  - name: AAIS API Auth
    url: https://agentaishield.com/api/auth/me
    expectedStatusCodes:
      - 200
      - 401

  - name: AAIS Health
    url: https://agentaishield.com/health
    expectedStatusCodes:
      - 200

  - name: AAIS Ingest API
    url: https://agentaishield.com/api/v1/ingest
    method: POST
    headers:
      - "Content-Type: application/json"
    body: '{"test": true}'
    expectedStatusCodes:
      - 200
      - 401
      - 400

notifications:
  - type: discord
    url: $DISCORD_WEBHOOK_URL

status-website:
  cname: status.agentaishield.com
  favicon: "https://raw.githubusercontent.com/you-ventures/upptime-status/master/favicon-32.png"
  logoUrl: "https://raw.githubusercontent.com/you-ventures/upptime-status/master/icon.svg"
  name: AgentAIShield
  theme: dark
  introTitle: "Agent**AI**Shield — Service Status"
  introMessage: Real-time uptime monitoring for AgentAIShield services. Checks every 5 minutes.
  navbar:
    - title: Status
      href: /
    - title: AgentAIShield
      href: https://agentaishield.com
    - title: Login
      href: https://agentaishield.com/login.html
